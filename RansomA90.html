 0%{transform:scale(.72) translate(-12px,7px) rotate(-3deg)}
 20%{transform:scale(1.08) translate(11px,-8px) rotate(3deg)}
 40%{transform:scale(.9) translate(-8px,-10px) rotate(-2deg)}
 60%{transform:scale(1.2) translate(8px,9px) rotate(4deg)}

<body>
<div class="main" id="main">
 <div class="face" aria-hidden="true"></div>
 <div class="title">YOUR APPS<br>HAVE BEEN<br>ENCRYPTED</div>
 <div class="warning">
  <div class="warning-text">
   IF YOU DO NOT CLICK 50 TIMES<br>
   BEFORE THIS TIMER ENDS,<br>
   YOUR APPS WILL BE <span class="red">UNRECOVERABLE</span>
  </div>
 </div>
 <div class="tap-zone" id="tap"><span>[<span id="count">0</span>]</span></div>
 <div class="time">TIME: <span id="time">30</span></div>
</div>
<div class="result win" id="win">
 <div class="thank">THANK YOU</div>
 <div class="thumb">👍</div>
</div>
<div class="result fail" id="fail">
 <div class="jumpscare" aria-hidden="true"></div>
</div>
<script>
(function(){
 let taps=0,time=30,done=false;
 const tap=document.getElementById('tap');
 const count=document.getElementById('count');
 const clock=document.getElementById('time');
 const win=document.getElementById('win');
 const fail=document.getElementById('fail');

 function finishWin(){
  if(done)return; done=true;
  win.style.display='flex';
  clearInterval(timer);
 }
 function finishFail(){
  if(done)return; done=true;
  fail.style.display='flex';
  clearInterval(timer);
  if(navigator.vibrate) navigator.vibrate([80,40,120]);
 }
 function doTap(e){
  if(done)return;
  if(e) e.preventDefault();
  taps++;
  count.textContent=taps;
  tap.classList.add('pressed');
  setTimeout(()=>tap.classList.remove('pressed'),65);
  if(taps>=50) finishWin();
 }
 tap.addEventListener('pointerup',doTap,{passive:false});
 tap.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();doTap(e)}});
 const timer=setInterval(()=>{
  if(done)return;
  time--;
  clock.textContent=time;
  if(time<=0) finishFail();
 },1000);
})();
</script>
